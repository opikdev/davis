[workspace]
members = [
    "crates/agent",
    "crates/ai",
    "crates/core",
    "crates/library",
    "crates/project",
    "src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Dependency debug info is most of the build size, and DuckDB alone adds 1.5 GB per copy.
[profile.dev.package."*"]
debug = false

# Unoptimized DuckDB is many times slower, which made a small Page take
# seconds to run in development. Release builds are always optimized.
[profile.dev.package.libduckdb-sys]
opt-level = 3
