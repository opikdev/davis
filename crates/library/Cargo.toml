[package]
name = "davis-library"
description = "Public datasets Davis can download from their publishers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
davis-core = { path = "../core" }
davis-project = { path = "../project" }
reqwest = { version = "0.13.5", features = ["blocking"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tiny_http = "0.12"
