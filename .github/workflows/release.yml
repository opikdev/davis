name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Add both Mac architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Davis {0}', github.ref_name) || '' }}
          releaseBody: "Before you open Davis for the first time, read [Install Davis](https://github.com/${{ github.repository }}/blob/main/docs/install.md). These builds aren't code signed yet, so macOS and Windows warn you first. See the [code signing policy](https://github.com/${{ github.repository }}/blob/main/docs/code-signing.md) and the [privacy policy](https://github.com/${{ github.repository }}/blob/main/docs/privacy.md)."
          releaseDraft: true
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
      - name: Check the Mac app is sealed
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 target/universal-apple-darwin/release/bundle/macos/Davis.app
          codesign -d --entitlements - target/universal-apple-darwin/release/bundle/macos/Davis.app | grep -q disable-library-validation
