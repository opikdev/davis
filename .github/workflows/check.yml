name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # Service containers only run on Linux, so the live database tests run there.
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-22.04' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: davis-test
          POSTGRES_DB: davis_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: ${{ matrix.os == 'ubuntu-22.04' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: davis-test
          MYSQL_DATABASE: davis_test
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdavis-test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev webkit2gtk-driver xvfb
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Load the test databases
        if: runner.os == 'Linux'
        run: |
          psql -h localhost -U postgres -d davis_test -f crates/core/fixtures/postgres.sql
          mysql -h 127.0.0.1 -uroot -pdavis-test davis_test < crates/core/fixtures/mysql.sql
        env:
          PGPASSWORD: davis-test
      - run: pnpm check
        env:
          DAVIS_TEST_POSTGRES: ${{ runner.os == 'Linux' && 'postgres://postgres:davis-test@localhost:5432/davis_test' || '' }}
          DAVIS_TEST_MYSQL: ${{ runner.os == 'Linux' && 'mysql://root:davis-test@127.0.0.1:3306/davis_test' || '' }}
      - run: pnpm tauri build --debug
      - name: Install the WebDriver tools
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Build Davis with a WebView2 debugging port
        if: runner.os == 'Windows'
        run: pnpm tauri build --debug --no-bundle --config "${{ github.workspace }}/e2e/tauri.windows.json"
      - name: Install the Edge driver
        if: runner.os == 'Windows'
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          msedgedriver-tool.exe
          echo "$PWD" >> $env:GITHUB_PATH
      - run: pnpm install --dir e2e --frozen-lockfile
        if: runner.os != 'macOS'
      - name: Run the app end to end
        if: runner.os == 'Linux'
        run: xvfb-run pnpm --dir e2e test
      - name: Run the app end to end
        if: runner.os == 'Windows'
        run: pnpm --dir e2e test
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os != 'macOS'
        with:
          name: e2e-screenshots-${{ runner.os }}
          path: e2e/output
          if-no-files-found: ignore
