name: Bug report
description: Something in Davis doesn't work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Davis version
      description: Shown on the Releases page you downloaded from, such as 0.2.1
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps that lead to the problem, one per line
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
      description: Include any message Davis showed. Leave out passwords, API keys, and private data.
    validations:
      required: true
  - type: input
    id: ai
    attributes:
      label: AI connected, if it's about Chat
      description: Such as Claude Code, an OpenAI key, or Ollama
