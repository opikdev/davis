name: Feature request
description: Something you'd like Davis to do
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you're trying to do
      description: The task or question, and the data it's about
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: What you tried in Davis, or what you use instead
